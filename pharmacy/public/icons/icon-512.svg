<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#6366f1" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Glowing background ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#pillGrad)" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="16 12"/>

  <!-- Medical Cross Motif in Center -->
  <g filter="url(#glow)">
    <!-- Horizontal Cross Bar -->
    <rect x="136" y="216" width="240" height="80" rx="28" fill="url(#crossGrad)"/>
    <!-- Vertical Cross Bar -->
    <rect x="216" y="136" width="80" height="240" rx="28" fill="url(#crossGrad)"/>
  </g>

  <!-- Center Capsule / Pill Symbol -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
    <!-- Left Capsule Half -->
    <path d="M 216,196 C 216,173.9 233.9,156 256,156 C 278.1,156 296,173.9 296,196 L 296,256 L 216,256 Z" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Right Capsule Half -->
    <path d="M 216,256 L 296,256 L 296,316 C 296,338.1 278.1,356 256,356 C 233.9,356 216,338.1 216,316 Z" fill="url(#pillGrad)"/>
    <line x1="216" y1="256" x2="296" y2="256" stroke="#0f172a" stroke-width="5"/>
  </g>

  <!-- Star of Life / Australia Southern Cross Accent Dots -->
  <circle cx="370" cy="140" r="10" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="390" cy="190" r="7" fill="#818cf8"/>
  <circle cx="350" cy="220" r="8" fill="#c084fc"/>
  <circle cx="140" cy="370" r="10" fill="#34d399" filter="url(#glow)"/>

  <!-- Sparkle Accent -->
  <path d="M 120,130 Q 120,150 100,150 Q 120,150 120,170 Q 120,150 140,150 Q 120,150 120,130 Z" fill="#fbbf24"/>
</svg>
