/* Runic Nodes & Nexus */

const AudioEngine = {
  ctx: null,
  muted: false,
  init() {
    if (!this.ctx && typeof AudioContext !== "undefined") {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
  },
  playTone(freq, type = "sine", duration = 0.5, gainVal = 0.1) {
    if (this.muted) return;
    try {
      this.init();
      if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch(e) {}
  },
  chimeShadow() {
    this.playTone(174.61, "sawtooth", 0.6, 0.08);
    setTimeout(() => this.playTone(207.65, "triangle", 0.7, 0.08), 120);
    setTimeout(() => this.playTone(261.63, "sine", 1.0, 0.09), 240);
    setTimeout(() => this.playTone(329.63, "sine", 1.2, 0.05), 360);
  },
  chimeCoders() {
    [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, idx) => {
      setTimeout(() => this.playTone(f, "square", 0.08, 0.04), idx * 60);
    });
  },
  chimeAnjeeran() {
    this.playTone(220, "sine", 0.8, 0.1);
    setTimeout(() => this.playTone(440, "triangle", 0.9, 0.08), 150);
    setTimeout(() => this.playTone(659.25, "sine", 1.2, 0.06), 300);
  },
  chimeNexus() {
    [440, 554.37, 659.25, 880, 1108.73, 1318.51].forEach((f, idx) => {
      setTimeout(() => this.playTone(f, "sine", 1.4, 0.08), idx * 110);
    });
  },
  flameBondSound() {
    [329.63, 440, 554.37, 659.25, 880].forEach((f, idx) => {
      setTimeout(() => this.playTone(f, "triangle", 1.2, 0.09), idx * 120);

    this.playTone(528, "sine", 0.8, 0.09); // Solfeggio Transformation
    setTimeout(() => this.playTone(660, "sine", 1.0, 0.07), 120);
    setTimeout(() => this.playTone(792, "sine", 1.2, 0.06), 240);
  },
  chimeSynthesizer(stage = 1) {
    const freqs = {
      1: [432, 540],
      2: [528, 660, 792],
      3: [639, 741, 852, 963],
      4: [432, 528, 639, 741, 852, 1080]
    }[stage] || [528, 660];
    freqs.forEach((f, idx) => {
      setTimeout(() => this.playTone(f, "sine", 1.2, 0.08), idx * 100);
    });
  },
  chimeBuild() {
    [392, 523.25, 659.25, 783.99].forEach((f, idx) => {
      setTimeout(() => this.playTone(f, "triangle", 0.6, 0.09), idx * 90);
    });
  },
  chimeGorastakh() {
    this.playTone(392, "sine", 0.8, 0.12);
    setTimeout(() => this.playTone(587.33, "triangle", 0.9, 0.09), 100);
    setTimeout(() => this.playTone(783.99, "sine", 1.2, 0.06), 220);
  },
  chimeAngel() {
    this.playTone(523.25, "sine", 0.5, 0.08);
    setTimeout(() => this.playTone(659.25, "sine", 0.5, 0.08), 80);
    setTimeout(() => this.playTone(783.99, "sine", 0.6, 0.09), 160);
    setTimeout(() => this.playTone(1046.50, "sine", 0.8, 0.07), 240);
  },
  pickupSound() {
    this.playTone(659.25, "triangle", 0.4, 0.1);
    setTimeout(() => this.playTone(987.77, "sine", 0.6, 0.12), 120);
  },
  triumphSound() {
    [440, 554.37, 659.25, 880].forEach((f, idx) => {
      setTimeout(() => this.playTone(f, "triangle", 1.5, 0.1), idx * 150);
    });
  }
};

function showStoryToast(text, duration = 3500) {
  const existing = document.querySelector(".story-toast");
  if (existing) existing.remove();
  const t = document.createElement("div");
  t.className = "story-toast";
  t.innerHTML = text;
  document.body.appendChild(t);
  setTimeout(() => { if (t.parentNode) t.remove(); }, duration);
}

window.addEventListener("message", (event) => {

  const { type, data } = event.data;

  if (type === "ARSHNAZ_SYNC_STATE") {
    if (data) {
      saveArshnazStorageData(data);
    }
  } else if (type === "ARSHNAZ_AWARD_ESSENCE") {
    const amount = Number(event.data.amount) || 10;
    tt.essence = (tt.essence || 0) + amount;
    Nn();
    dr();
    Jo();

  };
  const bases = ["نیلوفر", "ارکیده", "بامبو", "اختروش", "پیچک", "بلورین", "شکوفه"];
  const pList = prefixes[p] || ["کیهانی"];
  const sList = prefixes[s] || ["همگرا"];
  const pWord = pList[Math.floor(Math.random() * pList.length)];
  const sWord = sList[Math.floor(Math.random() * sList.length)];
  const bWord = bases[Math.floor(Math.random() * bases.length)];
  return `${pWord}-${bWord} ${sWord}`;
}

    primary: synthSelectedPrimary,
    secondary: synthSelectedSecondary,
    color: pMeta.color,
    secondaryColor: sMeta.color,

function evolveHybrid(hybridId) {
  const h = (tt.synthesizedHybrids || []).find(x => x.id === hybridId);
  if (!h || h.stage >= 4) return;

  const arsh = getArshnazStorageData();

  if (h.stage === 1) {
    if ((tt.essence || 0) < 5) {
      showStoryToast("⚠️ به ۵ گوهر نور برای جوانه زدن نیاز است.");
      return;
    }
    tt.essence -= 5;
    h.stage = 2;
  } else if (h.stage === 2) {
    if ((tt.essence || 0) < 8 || (arsh.focusBlossoms || 0) < 1) {
      showStoryToast("⚠️ به ۸ گوهر نور و حداقل ۱ شکوفه پومودورو در ارشناز نیاز است.");
      return;
    }
    tt.essence -= 8;
    arsh.focusBlossoms -= 1;
    saveArshnazStorageData(arsh);
    h.stage = 3;
  } else if (h.stage === 3) {
    if ((tt.essence || 0) < 12 || (arsh.waterDrops || 0) < 10) {
      showStoryToast("⚠️ به ۱۲ گوهر نور و ۱۰ قطره آب در ارشناز نیاز است.");
      return;
    }
    tt.essence -= 12;
    arsh.waterDrops -= 10;
    saveArshnazStorageData(arsh);
    h.stage = 4;
  }

  addSoulBond(15, `تکامل «${h.name}» به ${STAGE_NAMES[h.stage].title}`);
  tt.powerAngel = Math.min(100, (tt.powerAngel || 25) + 15);
  tt.powerCoders = Math.min(100, (tt.powerCoders || 25) + 15);
  AudioEngine.chimeSynthesizer(h.stage);
  showStoryToast(`✨ شگفتی ژنتیک! «${h.name}» به ${STAGE_NAMES[h.stage].title} ارتقا یافت!`, 5000);
  Nn(); dr(); Jo();
  updateCompanion3DMesh();
  renderSynthesizerUI();
}

function buildCosmicStructure(structureId) {
  let blueprint = null;
  for (const list of Object.values(COSMIC_BLUEPRINTS)) {
    const found = list.find(x => x.id === structureId);
    if (found) { blueprint = found; break; }
  }
  if (!blueprint) return;

  const arsh = getArshnazStorageData();

  if ((tt.essence || 0) < blueprint.costEssence) {
    showStoryToast("⚠️ گوهر نور کافی نیست!");
    return;
  }
  if (blueprint.costSun && (arsh.sunEnergy || 0) < blueprint.costSun) {
    showStoryToast("⚠️ انرژی خورشید ارشناز کافی نیست!");
    return;
  }
  if (blueprint.costWater && (arsh.waterDrops || 0) < blueprint.costWater) {
    showStoryToast("⚠️ قطره‌های آب ارشناز کافی نیست!");
    return;
  }
  if (blueprint.costPomodoro && (arsh.focusBlossoms || 0) < blueprint.costPomodoro) {
    showStoryToast("⚠️ شکوفه پومودورو ارشناز کافی نیست!");
    return;
  }

  tt.essence -= blueprint.costEssence;
  if (blueprint.costSun) arsh.sunEnergy -= blueprint.costSun;
  if (blueprint.costWater) arsh.waterDrops -= blueprint.costWater;
  if (blueprint.costPomodoro) arsh.focusBlossoms -= blueprint.costPomodoro;
  saveArshnazStorageData(arsh);

  tt.cosmicStructures = tt.cosmicStructures || [];
  tt.cosmicStructures.push(blueprint.id);

  addSoulBond(15, `احداث ${blueprint.name}`);
  AudioEngine.chimeBuild();
  showStoryToast(`🏛️ سازهٔ کیهانی «${blueprint.name}» با موفقیت در جهان سه‌بعدی احداث شد!`, 5000);
  Nn(); dr(); Jo();
  spawnStructure3DMesh(blueprint);
  renderCosmicBuilderUI();
}

  if (selectedRunicNodes.includes(nodeId)) {
    selectedRunicNodes = selectedRunicNodes.filter(x => x !== nodeId);

    selectedRunicNodes.push(nodeId);

  renderRunicTerminalModal();

function buyShadowSeed(plantKey, cost) {
  if ((tt.essence || 0) < cost) {
    showStoryToast(`⚠️ گوهر نور کافی نیست! قیمت: ${cost} گوهر.`);
    return;
  }
  tt.essence -= cost;
  tt.plants.push({ id: plantKey + "_" + Date.now(), type: plantKey, plantedAt: Date.now() });
  addSoulBond(5, "کاشت بذر کیهانی ضدتاریکی");
  Nn(); dr(); Jo();
  AudioEngine.pickupSound();
  showStoryToast(`🌱 بذر کیهانی ${on[plantKey]?.name || plantKey} به باغ افزوده شد!`);
  openMehrabDialogue("seeds");
}

// 13. Dynamic Planetary Atmospheric Fog & Animation Controller
const targetFogColor = new kt("#b8ddd8");
const targetBgColor = new kt("#b8ddd8");
let lastSanctuaryAbsorption = 0;
let wasInSanctuary = false;

function cosmicAnimationTick() {
  if (!Me || !re) return;

  const t = performance.now() * 0.001;

  // Starfield gentle rotation
  if (celestialStarfield) {
    celestialStarfield.rotation.y += 0.0003;
  }

  // Eye Concentric Rings rotation
  if (outerEyeRing) outerEyeRing.rotation.z += 0.004;
  if (midEyeRing) midEyeRing.rotation.z -= 0.006;
  if (innerEyeRing) innerEyeRing.rotation.z += 0.008;

  // Anjeeran fig floating rings rotation
  if (figCore) {
    figCore.position.y = 3.5 + Math.sin(t * 1.5) * 0.35;
    figRing1.rotation.z += 0.015;
    figRing2.rotation.z -= 0.012;
  }

  // Light beams subtle breathing pulse
  const beamPulse = 0.14 + Math.sin(t * 2) * 0.04;
  if (beamSanctuary) beamSanctuary.material.opacity = beamPulse;
  if (beamGreatEye) beamGreatEye.material.opacity = beamPulse * 1.1;

  // Walkable Energy Sanctuary proximity detection (center: 0, -2, radius: 8.5)
  const distToSanctuary = Math.hypot(re.position.x - 0, re.position.z - (-2));
  const isInSanctuary = distToSanctuary <= 8.5;

  // Sanctuary Status Badge in HUD
  const sanctBadge = document.getElementById("sanctuary-status-badge");
  if (sanctBadge) {
    if (isInSanctuary) sanctBadge.classList.add("active");
    else sanctBadge.classList.remove("active");
  }

  if (isInSanctuary) {
    if (!wasInSanctuary) {
      AudioEngine.chimeSanctuary();
      showStoryToast("✦ ورود به باغ دوشاخ‌ها · هالهٔ جذب جوهرهٔ نور فعال شد!");
      wasInSanctuary = true;
    }

    // Active Ground Aura Ripple
    caravanAuraRing.visible = true;
    caravanAuraRing.position.set(re.position.x, 0.06, re.position.z);
    const rScale = 1.0 + Math.sin(t * 4) * 0.22;
    caravanAuraRing.scale.set(rScale, rScale, 1);

    // Stream ambient stardust toward caravan
    const pAttr = stardustGeo.attributes.position;
    for (let i = 0; i < stardustCount; i++) {
      const idx = i * 3;
      const dx = re.position.x - pAttr.array[idx];
      const dz = re.position.z - pAttr.array[idx + 2];
      const d = Math.hypot(dx, dz);
      if (d < 16 && d > 0.5) {
        pAttr.array[idx] += dx * 0.025;
        pAttr.array[idx + 2] += dz * 0.025;
      }
    }
    pAttr.needsUpdate = true;

    // Periodic Essence & Arshnaz Energy absorption (every 2.5 seconds)
    const now = Date.now();
    if (now - lastSanctuaryAbsorption >= 2500) {
      lastSanctuaryAbsorption = now;
      tt.essence = (tt.essence || 0) + 1;
      const arsh = getArshnazStorageData();
      let absorbedBonus = 0;
      if ((arsh.sunEnergy || 0) >= 2) {
        arsh.sunEnergy -= 2;
        absorbedBonus += 2;
      }
      if ((arsh.waterDrops || 0) >= 4) {
        arsh.waterDrops -= 4;
        absorbedBonus += 1;
      }
      if (absorbedBonus > 0) {
        saveArshnazStorageData(arsh);
        tt.essence += absorbedBonus;
      }
      Nn(); dr(); Jo();
      AudioEngine.playTone(660, "sine", 0.3, 0.04);
    }
  } else {
    wasInSanctuary = false;
    caravanAuraRing.visible = false;

    // Return stardust particles to gentle ambient floating oscillation
    const pAttr = stardustGeo.attributes.position;
    for (let i = 0; i < stardustCount; i++) {
      const info = stardustInfo[i];
      const idx = i * 3;
      pAttr.array[idx + 1] = info.origY + Math.sin(t * info.speed + info.phase) * 0.4;
    }
    pAttr.needsUpdate = true;
  }

  // Floating Procedural Companion Motion
  if (hybridCompanionGroup && hybridCompanionGroup.visible) {
    const targetX = re.position.x + Math.cos(t * 1.6) * 1.7;
    const targetZ = re.position.z + Math.sin(t * 1.6) * 1.7;
    const targetY = re.position.y + 1.8 + Math.sin(t * 3) * 0.25;

    hybridCompanionGroup.position.x += (targetX - hybridCompanionGroup.position.x) * 0.08;
    hybridCompanionGroup.position.y += (targetY - hybridCompanionGroup.position.y) * 0.08;
    hybridCompanionGroup.position.z += (targetZ - hybridCompanionGroup.position.z) * 0.08;
